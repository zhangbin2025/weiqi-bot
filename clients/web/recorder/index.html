<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>围棋记谱</title>
  <link rel="stylesheet" href="../shared/assets/css/ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      touch-action: manipulation;
    }

    .page-container {
      background: white;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page-container.compact {
      justify-content: flex-start;
    }

    .page-container.compact .board-section {
      flex: 0 0 auto;
      padding: 4px;
    }

    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .page-header .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .page-header .page-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-header .page-subtitle {
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 18px;
    }

    .page-header .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-indicator {
      padding: 4px 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      font-size: 11px;
      opacity: 0.9;
    }

    .mode-indicator.setup-mode {
      background: rgba(255,193,7,0.3);
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 20px;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .menu-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      min-width: 180px;
      display: none;
      z-index: 1000;
      overflow: hidden;
    }

    .dropdown-menu.visible {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: #333;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .dropdown-item:hover {
      background: #f5f5f5;
    }

    .dropdown-item:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dropdown-item.hidden {
      display: none;
    }

    .dropdown-divider {
      height: 1px;
      background: #e8e8e8;
      margin: 4px 0;
    }

    .board-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      min-height: 0;
      overflow: hidden;
    }

    .page-container.compact .board-section {
      flex: 0 0 auto;
      padding: 0;
    }

    #page-root {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 10px 0;
      position: relative;
    }

    #page-root canvas {
      max-width: 100%;
      height: auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin: 6px 0;
      padding: 0 2px;
      background: white;
      flex-shrink: 0;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .move-count {
      font-size: 14px;
      color: #333;
      white-space: nowrap;
      min-width: 60px;
      text-align: right;
    }

    .setup-tools {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .setup-tools.visible {
      display: flex;
    }

    .setup-tool-btn {
      width: 36px;
      height: 36px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #333;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .setup-tool-btn.active {
      border-color: #667eea;
      background: #f0f4ff;
      color: #667eea;
    }

    .setup-tool-btn:hover:not(.active) {
      border-color: #999;
    }

    .setup-tool-btn svg {
      width: 20px;
      height: 20px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .icon-btn:active:not(:disabled) {
      transform: scale(0.92);
      color: #333;
    }

    .icon-btn:hover:not(:disabled) {
      background: #f5f5f5;
    }

    .icon-btn.primary {
      color: #667eea;
    }

    .icon-btn.primary:hover:not(:disabled) {
      background: #f0f4ff;
    }

    /* 拍照摆子：参考照片
       缩略图态：常驻工具栏右侧（棋盘下方按钮栏的最右），点击放大；
       放大态：fixed 浮层，可拖到任意位置，避免遮住正在对照的棋盘区域 */
    .photo-ref {
      position: relative;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      background: #eee;
      cursor: zoom-in;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      /* 拖动时别选中文字/触发系统长按菜单 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .photo-ref[hidden] { display: none; }

    .photo-ref:hover { border-color: #667eea; }

    .photo-ref.enlarged {
      position: fixed;
      width: min(88vw, 420px);
      height: auto;
      border-radius: 12px;
      border-color: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      z-index: 1500;
      cursor: grab;
      /* 拖动浮层时不要让页面跟着滚 */
      touch-action: none;
      transition: none;
    }

    .photo-ref.enlarged.dragging { cursor: grabbing; }

    .photo-ref img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* ⚠️ 关键：不关掉原生图片拖拽，按下后浏览器会接管指针、发 pointercancel，
         自定义拖动只走一两帧就停住（表现为“拖了只动一点点”）。
         pointer-events:none 让命中测试落到容器上，容器再统一处理指针。 */
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    .photo-ref.enlarged img {
      height: auto;
      object-fit: contain;
    }

    /* 按钮只在放大态出现，缩略图态保持干净（它本身就是最小化后的样子） */
    .photo-ref-actions {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      gap: 6px;
    }

    .photo-ref.enlarged .photo-ref-btn {
      background: rgba(0,0,0,0.6);
    }

    .photo-ref.enlarged .photo-ref-actions {
      display: flex;
    }

    .photo-ref-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .photo-ref-btn:active { transform: scale(0.9); }

    /* 拍照摆子：识别进度遮罩 */
    .photo-progress {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2500;
    }

    .photo-progress[hidden] { display: none; }

    .photo-progress .box {
      background: #fff;
      border-radius: 14px;
      padding: 20px 22px;
      min-width: 240px;
      max-width: 80vw;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .photo-progress .msg {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .photo-progress .track {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }

    .photo-progress .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
      transition: width 0.25s ease;
    }

    .photo-progress .bar.indeterminate {
      width: 40%;
      animation: photoSlide 1.1s ease-in-out infinite;
    }

    @keyframes photoSlide {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
      color: #333;
    }

    .modal-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #667eea;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .modal-btn-cancel {
      background: #f5f5f5;
      color: #666;
    }

    .modal-btn-confirm {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    @media (min-width: 600px) {
      body {
        padding: 8px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .page-container {
        max-width: 500px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      }

      .board-section {
        padding: 0;
      }
    }
  </style>

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#667eea">
</head>
<body>
  <div class="page-container compact">
    <header class="page-header">
      <div class="header-left">
        <div class="page-title">围棋记谱</div>
        <div class="page-subtitle">手动录入棋谱</div>
      </div>
      <div class="header-right">
        <div class="mode-indicator" id="modeIndicator">对局模式</div>
        <div class="dropdown">
          <button class="menu-btn" id="menuBtn" title="菜单">⋮</button>
          <div class="dropdown-menu" id="dropdownMenu">
            <button class="dropdown-item" id="passMenuItem">⭕ 停一手</button>
            <button class="dropdown-item" id="setupModeMenuItem">🎯 摆子模式</button>
            <button class="dropdown-item hidden" id="playModeMenuItem">▶️ 对局模式</button>
            <button class="dropdown-item" id="photoSetupMenuItem">📷 拍照摆子</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" id="downloadMenuItem">📥 下载SGF</button>
            <button class="dropdown-item" id="copyMenuItem">📄 复制SGF</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" id="historyMenuItem">📋 历史棋谱</button>
          </div>
        </div>
      </div>
    </header>

    <div class="board-section">
      <div id="page-root"></div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button class="icon-btn" id="undoBtn" title="悔棋">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </button>
        <button class="icon-btn" id="saveBtn" title="保存棋谱">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
        </button>
        <button class="icon-btn" id="newBtn" title="清空棋盘">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
        
        <div class="setup-tools" id="setupTools">
          <button class="setup-tool-btn active" id="blackStoneBtn" title="黑子">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="black"/></svg>
          </button>
          <button class="setup-tool-btn" id="whiteStoneBtn" title="白子">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="white" stroke="black" stroke-width="2"/></svg>
          </button>
          <button class="setup-tool-btn" id="eraserBtn" title="橡皮擦">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L12 21"/>
              <path d="M6 11L13 18"/>
            </svg>
          </button>
        </div>
      </div>
      <span class="move-count" id="moveCountDisplay">第 <strong id="moveNum">0</strong> 手</span>

      <!-- 拍照摆子：参考照片缩略图，常驻按钮栏最右侧。
           放在这里而不是页面右下角，是为了让它和棋盘一起在视野里，
           点一下放大对照，再点最小化回到原位。 -->
      <div class="photo-ref" id="photoRef" hidden>
        <img id="photoRefImg" alt="参考照片" draggable="false">
        <div class="photo-ref-actions">
          <button class="photo-ref-btn" id="photoRefMinBtn" type="button" title="最小化">−</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="saveModal">
    <div class="modal-content">
      <div class="modal-title">保存棋谱</div>
      <input type="text" class="modal-input" id="blackNameInput" placeholder="黑方名称（可不填）">
      <input type="text" class="modal-input" id="whiteNameInput" placeholder="白方名称（可不填）">
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="saveCancelBtn">取消</button>
        <button class="modal-btn modal-btn-confirm" id="saveConfirmBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 拍照摆子：识别进度遮罩（首次使用要下 10MB opencv，必须给进度，
       否则用户会以为页面卡死） -->
  <div class="photo-progress" id="photoProgress" hidden>
    <div class="box">
      <div class="msg" id="photoProgressMsg">正在处理…</div>
      <div class="track"><div class="bar" id="photoProgressBar"></div></div>
    </div>
  </div>

  <!-- 拍照摆子：隐藏的 file input，由「📷 拍照摆子」菜单项触发。
       用 accept="image/*" 而不是 getUserMedia —— 移动端会直接唤起系统相机/相册，
       无需权限申请，也不用自己写预览界面。 -->
  <input type="file" id="photoFileInput" accept="image/*" style="display:none;">

  <script type="module" src="./index.ts"></script>
</body>
</html>
