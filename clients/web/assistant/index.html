<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>围棋 AI 助手</title>
    
    <link rel="stylesheet" href="../shared/assistant.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <!-- 页面容器 -->
    <div class="page-container">
        <!-- 渐变标题栏 -->
        <div class="wechat-header">
            <h1 class="wechat-title">围棋 AI 助手</h1>
            <button class="toolbar-btn" onclick="toggleCommandMenu()" title="更多">⋮</button>
        </div>
        
        <!-- 聊天区域 -->
        <div class="chat-container" id="chatContainer">
            <div class="status">
                <span>✅</span>
                <span id="loadingText">AI助手已就绪</span>
            </div>
            <!-- 加载更多指示器 -->
            <div class="load-more-indicator" id="loadMoreIndicator">
                <div class="spinner"></div>
                <span>加载更多消息...</span>
            </div>
        </div>
        
        <!-- 输入框 -->
        <div class="input-container" style="position: relative;">
            <!-- 命令补全菜单 -->
            <div class="command-suggest" id="commandSuggest"></div>
            
            <textarea class="input-textarea" id="userInput" placeholder="输入您想做的事" disabled rows="1"></textarea>
            <input type="file" id="sgfUpload" accept=".sgf" style="display: none;">
            <!-- 拍照记谱：拍照入口。accept="image/*" 不加 capture —— 加了会强制
                 后置相机且不给选相册，recorder 的「拍照摆子」也是这个取舍。 -->
            <input type="file" id="photoRecordInput" accept="image/*" style="display: none;">
            <button class="toolbar-btn send-btn" id="sendBtn" onclick="sendMessage()" disabled title="发送">➤</button>
        </div>
        
        <!-- Command Menu -->
        <div class="command-menu" id="commandMenu">
            <div class="command-item" onclick="document.getElementById('sgfUpload').click(); toggleCommandMenu();">
                <div class="command-icon">📄</div>
                <div class="command-title">导入 SGF 文件</div>
            </div>
            <div class="command-item" onclick="scanQRCode()">
                <div class="command-icon">🔳</div>
                <div class="command-title">扫描二维码</div>
            </div>
            <div class="command-item" onclick="photoRecord()">
                <div class="command-icon">📷</div>
                <div class="command-title">拍照记谱</div>
            </div>
            <div class="command-item" onclick="clearAllHistory(); toggleCommandMenu();">
                <div class="command-icon">🗑️</div>
                <div class="command-title">清空聊天记录</div>
            </div>
            <div class="command-item" onclick="exportHistory(); toggleCommandMenu();">
                <div class="command-icon">📤</div>
                <div class="command-title">导出聊天记录</div>
            </div>

            <!-- 下载客户端 - 仅纯 Web 端显示 -->
            <div class="command-item has-submenu" id="downloadMenuItem" onclick="toggleSubmenu(this)">
                <div class="command-icon">📥</div>
                <div class="command-title">下载客户端</div>
                <div class="submenu-arrow">▸</div>
            </div>
            <div class="submenu" id="downloadSubmenu">
                <div class="submenu-item" onclick="window.open('https://bot.weiqi.lol/win','_blank'); toggleCommandMenu();">
                    <span class="submenu-icon">💻</span>
                    <span>Windows 版</span>
                </div>
                <div class="submenu-item" onclick="window.open('https://bot.weiqi.lol/apk','_blank'); toggleCommandMenu();">
                    <span class="submenu-icon">📱</span>
                    <span>Android 版</span>
                </div>
            </div>

        </div>
    </div>
    
    <!-- Command Menu Overlay -->
    <div class="command-menu-overlay" id="commandMenuOverlay" onclick="toggleCommandMenu()"></div>

    <script src="../shared/error-catch.js"></script>
    <script type="module" src="./main.js?v=20260529"></script>

    <script src="../shared/status-bar.js"></script>
    
    <!-- 二级菜单逻辑 + 仅 Web 端显示下载项 -->
    <script>
    (function() {
        // 检测是否为纯 Web 端（非 WeiqiApp 客户端）
        var isWebOnly = !navigator.userAgent.includes('WeiqiApp');
        var downloadMenuItem = document.getElementById('downloadMenuItem');
        var downloadSubmenu = document.getElementById('downloadSubmenu');
        if (downloadMenuItem) {
            downloadMenuItem.style.display = isWebOnly ? 'flex' : 'none';
        }
        if (downloadSubmenu) {
            downloadSubmenu.style.display = isWebOnly ? '' : 'none';
        }
    })();

    // 二级子菜单切换
    function toggleSubmenu(parentItem) {
        var submenu = parentItem.nextElementSibling;
        if (!submenu || !submenu.classList.contains('submenu')) return;
        var isOpen = submenu.classList.contains('show');
        // 关闭所有子菜单
        document.querySelectorAll('.submenu.show').forEach(function(el) {
            el.classList.remove('show');
        });
        document.querySelectorAll('.command-item.submenu-open').forEach(function(el) {
            el.classList.remove('submenu-open');
        });
        // 如果之前是关闭的，则打开
        if (!isOpen) {
            submenu.classList.add('show');
            parentItem.classList.add('submenu-open');
        }
    }

    // 关闭主菜单时同时关闭子菜单
    var origToggle = window.toggleCommandMenu;
    window.toggleCommandMenu = function() {
        if (origToggle) origToggle();
        document.querySelectorAll('.submenu.show').forEach(function(el) {
            el.classList.remove('show');
        });
        document.querySelectorAll('.command-item.submenu-open').forEach(function(el) {
            el.classList.remove('submenu-open');
        });
    };
    </script>
    
    <!-- 键盘适配：覆盖 status-bar.js 的逻辑，适配 flexbox 布局 -->
    <script>
    (function() {
        const pageContainer = document.querySelector('.page-container');
        const chatContainer = document.querySelector('.chat-container');
        if (!pageContainer) return;

        function scrollToBottom() {
            setTimeout(function() {
                if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }

        // ============ 测量 ============
        // 两个来源各有权重：
        //   · 原生注入的键盘高度（最可信，由 WindowInsets 换算而来）
        //   · window.innerHeight（原生修复后视口会随键盘真正缩小，此值即视口高）
        // 不能用 innerHeight - visualViewport.height 反推键盘高：
        //   两者会互相追赶，推出来的差值不可靠。

        let fullH = 0;            // 无键盘时的视口全高（单调递增）
        let nativeKb = null;      // 原生注入：null=未注入，0=明确收起
        let lastAppliedHeight = null;

        function visibleH() {
            const vv = window.visualViewport;
            return (vv && vv.height > 0) ? vv.height : window.innerHeight;
        }

        // 目标高度决策 —— 必须同时覆盖两种世界：
        //   A) 视口已缩小（原生 padding 修复生效）：innerHeight 本身即视口高，
        //      直接用。绝不能再减一次键盘高，否则双倍扣减、输入框上方空一大块。
        //   B) 视口未缩小（历史行为，GeckoView 不吃 adjustResize）：自行扣减键盘高。
        //   另以 vv 兜底原生注入尚未送达的窗口（/store clear 重载后头几百毫秒）。
        function syncLayout() {
            const inner = window.innerHeight;
            const vvH = visibleH();
            if (inner > fullH) fullH = inner;

            const viewShrunk = fullH > 0 && inner < fullH - 4;
            const vvShrunk = fullH > 0 && vvH > 0 && vvH < fullH - 40;

            let target;
            if (nativeKb !== null && nativeKb > 0) {
                const h = viewShrunk
                    ? Math.min(inner, vvH || inner)
                    : Math.max(0, fullH - nativeKb);
                target = h + 'px';
            } else if (nativeKb === null && vvShrunk) {
                target = Math.max(0, vvH) + 'px';
            } else if (nativeKb === 0 && !viewShrunk) {
                target = '';                       // 原生明确收起
            } else if (nativeKb === null && !viewShrunk && !vvShrunk) {
                target = '';                       // 无键盘
            } else {
                return;                            // 状态不明：保持现状，绝不盲目清回 100dvh
            }

            if (target !== lastAppliedHeight) {
                lastAppliedHeight = target;
                pageContainer.style.height = target;
                scrollToBottom();
            }
            void pageContainer.offsetHeight;
        }

        // 覆盖 status-bar.js 定义的函数（由 Android 原生侧注入键盘高度调用）
        window.onKeyboardHeightChange = function(keyboardHeight) {
            nativeKb = Math.max(0, Number(keyboardHeight) || 0);
            syncLayout();
        };

        // ============ 触发时机 ============
        // 刷新后自检（/store clear 场景）：重载后原生去重会吞掉注入，
        // 页面按过期的 100dvh 渲染，输入框落到软键盘下方。
        [0, 100, 300, 600, 1200].forEach(function(t) {
            setTimeout(function() { syncLayout(); }, t);
        });
        window.addEventListener('load', function() { syncLayout(); });

        // 聚焦时主动轮询，覆盖键盘动画窗口（~1.6s）。
        // 键盘弹出时机不可靠：resize / visualViewport.resize 未必派发，
        // 页面加载时的定时器在用户点输入框时也早已跑完。
        // 轮询能保证在动画期间反复对齐高度。
        const POLL = [0, 50, 100, 150, 200, 250, 300, 400, 500, 700, 900, 1200, 1600];
        let pollTimers = [];
        function stopPoll() { pollTimers.forEach(clearTimeout); pollTimers = []; }
        function startPoll() {
            stopPoll();
            POLL.forEach(function(d) {
                pollTimers.push(setTimeout(function() { syncLayout(); }, d));
            });
        }

        // textarea 初始 disabled，事件委托到 document 才覆盖启用后的聚焦
        // 归零所有可能的滚动偏移。
        // 若键盘弹出时 GeckoView 把文档/视口平移了（scrollY 或 vv.offsetTop != 0），
        // 布局坐标即使正确（inputBottom=780），屏幕上仍会下移同样距离 ——
        // 这正是「数值对了但视觉没顶上去」的唯一合理解释。
        function resetScroll() {
            try {
                if (window.scrollY) window.scrollTo(0, 0);
                const se = document.scrollingElement || document.documentElement;
                if (se && se.scrollTop) se.scrollTop = 0;
                if (document.body && document.body.scrollTop) document.body.scrollTop = 0;
                void pageContainer.offsetHeight;   // 同上：强制重排
            } catch (e) {}
        }

        document.addEventListener('focusin', function(e) {
            if (e.target && e.target.id === 'userInput') {
                resetScroll();
                startPoll();
            }
        });
        document.addEventListener('focusout', function(e) {
            if (e.target && e.target.id === 'userInput') {
                stopPoll();
                [0, 100, 300].forEach(function(t) {
                    setTimeout(function() { syncLayout(); }, t);
                });
            }
        });

        const inputEl = document.getElementById('userInput');
        if (inputEl) {
            const onTap = function () { resetScroll(); startPoll(); };
            inputEl.addEventListener('click', onTap);
            inputEl.addEventListener('touchstart', onTap, { passive: true });
        }

        // 兜底监听（能触发是赚到，不触发也不影响，靠轮询兜住）
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() { syncLayout(); });
        }
        window.addEventListener('resize', function() { syncLayout(); });
    })();
    </script>
</body>
</html>
