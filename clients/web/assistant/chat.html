<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>围棋 AI 对话</title>

    <!-- PDF 端侧抽文字：与 event 页同一份 cdnjs pdf.js（全局 pdfjsLib）。
         但这里必须 defer：chat.ts 是模块入口，同步外链脚本会阻塞整页解析，
         一旦 cdnjs 慢/不可达，连附件按钮的事件绑定都不会执行（2026-11-13 实测）。
         workerSrc 改由 PdfTextExtractor 首次调用时设置，不再用内联脚本。 -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- 与功能助手共用同一份样式，规则零改动 -->
    <link rel="stylesheet" href="../shared/assistant.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">

    <!-- 本页独有：未配置提示、会话列表卡片、打字指示器 -->
    <style>
        /* 消息块不再预留 46px 头像位（时间已能区分用户/AI），但仍保留普通左右留白：
           覆盖 shared/assistant.css 的 46px，回到 .message 基线的 12px，左右对称，
           与「AI助手已就绪」状态条（margin: 8px 12px）边缘一致。
           AI 气泡仍 width:100% 铺满内容盒；用户气泡按需占用、靠右自适应。 */
        .message.assistant { padding-right: 12px; }
        .message.user { padding-left: 12px; }

        #notReady {
            margin: 8px 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff8e1;
            color: #8a6d00;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #ffe082;
        }
        #notReady a { color: #667eea; text-decoration: underline; }

        /* 本地附件：按钮 + 待发送预览条（绝不显示 base64 正文） */
        .attach-btn { flex: 0 0 auto; }
        .attach-btn--on { background: #ecebff; border-color: #667eea; }
        #attachPreview { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px 0; }
        .attach-chip {
            display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
            padding: 4px 8px; border-radius: 999px; background: #f3f2ff;
            border: 1px solid #d9d6f5; font-size: 12px; color: #4a466e;
        }
        .attach-chip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .attach-chip__x { cursor: pointer; border: 0; background: none; color: #8a86b5; font-size: 14px; line-height: 1; }
        .attach-mode { display: none; align-items: center; gap: 8px; padding: 6px 12px 0; font-size: 12px; color: #666; }
        .attach-mode select { font-size: 12px; padding: 2px 6px; }
        /* 历史恢复时的附件摘要：只显示文件名/类型，不打印 base64 */
        .msg-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .msg-attachment {
            font-size: 12px; color: #5a5680; background: rgba(255,255,255,.6);
            border: 1px solid rgba(102,126,234,.25); border-radius: 8px; padding: 2px 8px;
        }

        .session-list {
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .session-card {
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            background: #fff;
            transition: border-color .15s, background .15s;
            /* 主体 + 右侧删除按钮；确认栏换行独占一行 */
            display: flex; align-items: flex-start; flex-wrap: wrap; gap: 10px;
        }
        .session-card:hover { border-color: #667eea; background: #f7f7ff; }
        .session-card--active { border-color: #667eea; background: #f3f2ff; }
        /* 卡片主体 + 右侧删除按钮：删除是卡片内独立操作，点击不应触发打开会话 */
        .session-card__body { flex: 1; min-width: 0; }
        .session-card__time { font-size: 12px; color: #999; margin-bottom: 4px; }
        .session-card__summary { font-size: 14px; color: #333; line-height: 1.4; word-break: break-word; }
        .session-card__delete {
            flex: 0 0 auto; border: 1px solid #f0d4d4; background: #fff6f6;
            color: #c23b3b; border-radius: 6px; padding: 4px 8px;
            font-size: 12px; line-height: 1; cursor: pointer; font-family: inherit;
        }
        .session-card__delete:hover { background: #ffecec; }
        /* 删除内联二次确认：不嵌套 WebDialog、不依赖 window.confirm */
        .session-card__confirm {
            display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
            margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0d4d4;
            width: 100%; font-size: 12px; color: #c23b3b; cursor: default;
        }
        .session-card__confirm > span { flex: 1; min-width: 120px; word-break: break-word; }
        .session-card__confirm button {
            border: 1px solid #dcdcf0; background: #f7f6ff; color: #5546a8;
            border-radius: 6px; padding: 4px 10px; font-size: 12px;
            cursor: pointer; font-family: inherit; white-space: nowrap;
        }
        .session-card__confirm .session-card__confirm-yes {
            background: #fff6f6; color: #c23b3b; border-color: #f0d4d4; font-weight: 600;
        }
        .session-empty { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }

        /* 复用渲染器 showTyping 需要的类名（功能页 CSS 里未定义） */
        .typing-indicator { display: flex; align-items: center; gap: 8px; padding: 0 12px; margin-bottom: 12px; }
        .message-avatar { font-size: 20px; }
        .typing-dots { display: flex; gap: 4px; background: #fff; padding: 10px 14px; border-radius: 12px; }
        .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: chatDot 1.2s infinite; }
        .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes chatDot { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

        /* 插件调试过程：默认折叠，纯展示、不写历史 */
        /* 过程块直接挂在 chatContainer 下，用 margin 对齐消息气泡：
           左右各 12px = 去掉头像位后消息块的左右留白（不再留 46px）。 */
        .plugin-trace { margin: 8px 12px 14px; }
        .plugin-trace__details {
            border: 1px solid #e3e0f3; border-radius: 10px;
            background: #faf9ff; overflow: hidden;
        }
        .plugin-trace--failed .plugin-trace__details { border-color: #f0d4d4; background: #fffafa; }
        /* 进行中：左侧呼吸条，用户不点开也能看出过程还在跑 */
        .plugin-trace__details[open] .plugin-trace__summary::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            margin-right: 6px; border-radius: 50%; background: #667eea;
            animation: tracePulse 1.2s ease-in-out infinite;
        }
        @keyframes tracePulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
        .plugin-trace__summary {
            padding: 8px 12px; font-size: 13px; color: #5b4b9e;
            cursor: pointer; user-select: none; font-weight: 600;
        }
        .plugin-trace__list {
            max-height: 45vh; overflow-y: auto; padding: 4px 12px 10px;
            border-top: 1px solid #e3e0f3;
        }
        .plugin-trace__step {
            padding: 6px 0; border-bottom: 0.5px dashed #e8e6f5; font-size: 12px;
        }
        .plugin-trace__step:last-child { border-bottom: none; }
        .plugin-trace__head { display: flex; align-items: center; gap: 8px; }
        .plugin-trace__tag { color: #8a86a8; font-family: monospace; }
        .plugin-trace__flag { margin-left: auto; color: #07a35a; font-weight: 700; }
        .plugin-trace__step--fail .plugin-trace__flag { color: #d34a4a; }
        .plugin-trace__detail { color: #4a465e; line-height: 1.5; word-break: break-word; margin-top: 2px; }
        .plugin-trace__code { margin-top: 6px; }
        .plugin-trace__code > summary { font-size: 12px; color: #667eea; cursor: pointer; }
        .plugin-trace__tools { margin: 4px 0; }
        .plugin-trace__tools .copy-btn {
            background: #667eea; color: #fff; border: none; border-radius: 4px;
            padding: 3px 8px; font-size: 12px; cursor: pointer;
        }
        .plugin-trace__tools .copy-btn.copied { background: #07C160; }
        .plugin-trace__pre {
            margin: 0; padding: 8px 10px; max-height: 260px; overflow: auto;
            background: #f4f2fb; border-radius: 6px; font-family: monospace;
            font-size: 11px; line-height: 1.45; color: #3a3550; white-space: pre-wrap;
            word-break: break-all;
        }

        /* 插件/技能管理面板（WebDialog 内容，两个弹框共用这套 class）。
           整体用 flex 定高、不滚动；滚动只发生在「条目列表」__body 上，
           标签栏留在滚动区之外，滚动条不再贯穿到标签那一栏。 */
        .plugin-panel {
            display: flex; flex-direction: column;
            max-height: 60vh; font-size: 13px;
        }
        .plugin-panel__empty { color: #999; text-align: center; padding: 20px 0; }
        /* 两个标签页：本地插件 / 在线插件 */
        .plugin-panel__tabs {
            display: flex; gap: 4px; border-bottom: 1px solid #e8e8ee;
            margin-bottom: 10px; background: #fff; flex: 0 0 auto;
        }
        .plugin-panel__tab {
            flex: 1; border: none; background: transparent; color: #777;
            padding: 8px 4px; font-size: 13px; font-family: inherit; cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .plugin-panel__tab--active {
            color: #5546a8; font-weight: 600; border-bottom-color: #667eea;
        }
        /* 在线列表的手动刷新：只在「在线」标签显示，常驻标签栏（不随列表滚动）。
           强制重读远端时绕过浏览器/GitHub Pages 的 HTTP 缓存，避免在线源更新后列表还是旧的。 */
        .plugin-panel__refresh {
            flex: 0 0 auto; align-self: center; margin-left: 6px;
            display: inline-flex; align-items: center; white-space: nowrap;
            border: 1px solid #dcdcf0; background: #f7f6ff; color: #5546a8;
            border-radius: 6px; padding: 4px 10px; font-size: 12px;
            font-family: inherit; cursor: pointer;
        }
        .plugin-panel__refresh:hover { background: #ece9ff; }
        .plugin-panel__refresh:disabled { opacity: .55; cursor: default; }
        .plugin-panel__refresh[hidden] { display: none; }
        /* 仅条目列表区滚动：撑满剩余高度、显示滚动条（含 WebKit 常显轨道） */
        .plugin-panel__body {
            flex: 1 1 auto; min-height: 0;
            overflow-y: scroll; padding-bottom: 4px;
            scrollbar-width: thin; scrollbar-color: #c9c5e4 transparent;
        }
        .plugin-panel__body::-webkit-scrollbar { width: 8px; }
        .plugin-panel__body::-webkit-scrollbar-track { background: #f4f3fb; border-radius: 4px; }
        .plugin-panel__body::-webkit-scrollbar-thumb {
            background: #c9c5e4; border-radius: 4px;
        }
        .plugin-panel__body::-webkit-scrollbar-thumb:hover { background: #a9a3d4; }
        /* 插件源管理 */
        .plugin-panel__sources {
            border: 1px solid #e8e8f2; border-radius: 10px;
            padding: 10px 12px; margin-bottom: 12px; background: #fafaff;
        }
        .plugin-panel__sources-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
        }
        .plugin-panel__source-current {
            font-family: monospace; font-size: 11px; color: #4b43a8;
            word-break: break-all; flex: 1; min-width: 0;
        }
        .plugin-panel__source-config { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e8e8f2; }
        .plugin-panel__source-config[hidden] { display: none; }
        .plugin-panel__source-add { display: flex; gap: 6px; }
        .plugin-panel__sources .plugin-panel__source-config > button { margin-top: 8px; }
        .plugin-panel__source-input {
            flex: 1; min-width: 0; border: 1px solid #dcdcf0; border-radius: 6px;
            padding: 5px 8px; font-size: 12px; font-family: monospace;
        }
        .plugin-panel__sources-hint {
            color: #999; font-size: 11px; line-height: 1.5; margin-top: 8px;
        }
        .plugin-panel__group { margin-bottom: 14px; }
        .plugin-panel__group-title {
            color: #888; font-size: 11px; margin-bottom: 6px; word-break: break-all;
        }
        .plugin-panel__card {
            border: 1px solid #e8e8e8; border-radius: 10px;
            padding: 10px 12px; margin-bottom: 10px; background: #fff;
        }
        /* 操作后定位：滚动回刚操作的条目并短暂高亮，让用户一眼看到结果。
           与 .session-card--active 用同一组强调色，不新造配色。 */
        .plugin-panel__card--focus {
            border-color: #667eea; background: #f7f6ff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, .22);
        }
        /* 明显提示：新装插件默认停用需手动启用。与 #notReady 同款警示配色，插在条目卡片顶部。 */
        .plugin-panel__enable-hint {
            margin: 0 0 10px; padding: 9px 10px;
            border-radius: 10px; background: #fff8e1; color: #8a6d00;
            border: 1px solid #ffe082; font-size: 12px; font-weight: 600; line-height: 1.5;
        }
        .plugin-panel__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .plugin-panel__name { font-weight: 600; color: #333; word-break: break-all; }
        .plugin-panel__state {
            font-size: 11px; padding: 1px 7px; border-radius: 10px;
            background: #eee; color: #777;
        }
        .plugin-panel__state--on { background: #e6f7ed; color: #07a35a; }
        .plugin-panel__meta { color: #999; font-size: 11px; margin: 4px 0; word-break: break-all; }
        .plugin-panel__intent { color: #555; line-height: 1.4; margin: 4px 0; }
        /* 功能按钮靠右：条目内容靠左阅读，操作统一收到右侧，扫列表时视线不跳。
           删除二次确认里插入的提示文字也随整组靠右，靠 flex-end 自动处理。 */
        .plugin-panel__actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; justify-content: flex-end; }
        .plugin-panel__actions button {
            border: 1px solid #dcdcf0; background: #f7f6ff; color: #5546a8;
            border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
        }
        .plugin-panel__actions button:hover { background: #ece9ff; }
        .plugin-panel__actions button:disabled { opacity: .55; cursor: default; }
        .plugin-panel__actions .plugin-panel__primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border-color: transparent; font-weight: 600;
        }
        .plugin-panel__actions .plugin-panel__primary:hover { background: #5a6fd8; }
        .plugin-panel__actions .plugin-panel__danger { color: #c23b3b; border-color: #f0d4d4; background: #fff6f6; }
        /* 「修改」/「保存」/「恢复默认」按钮复用面板按钮样式（源面板在 actions 容器外） */
        .plugin-panel__sources button {
            border: 1px solid #dcdcf0; background: #f7f6ff; color: #5546a8;
            border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
            font-family: inherit; white-space: nowrap;
        }
        .plugin-panel__sources button:hover { background: #ece9ff; }
        .plugin-panel__sources .plugin-panel__primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border-color: transparent; font-weight: 600;
        }
        .plugin-panel__sources .plugin-panel__primary:hover { background: #5a6fd8; }
        .plugin-panel__sources .plugin-panel__danger {
            color: #c23b3b; border-color: #f0d4d4; background: #fff6f6;
        }
        .plugin-panel__code {
            margin: 8px 0 0; padding: 8px 10px; max-height: 260px; overflow: auto;
            background: #f6f6fa; border-radius: 6px; font-family: monospace;
            font-size: 11px; line-height: 1.45; color: #333; white-space: pre-wrap;
            word-break: break-all;
        }
        /* 模型角色选择器（标题栏常驻） */
        .role-picker { position: relative; flex: 0 0 auto; }
        .role-btn {
            border: 1px solid #dcdcf0; border-radius: 16px;
            background: #f4f3ff; color: #4b43a8;
            font-size: 12px; line-height: 1; padding: 6px 10px;
            cursor: pointer; white-space: nowrap; font-family: inherit;
        }
        .role-btn:hover { background: #eae8ff; }
        .role-menu {
            display: none; position: absolute; right: 0; top: calc(100% + 8px);
            z-index: 60; min-width: 210px;
            background: #fff; border: 1px solid #e4e4ee; border-radius: 10px;
            box-shadow: 0 8px 24px rgba(30, 30, 60, .14);
            padding: 6px;
        }
        .role-option {
            display: flex; flex-direction: column; gap: 3px;
            width: 100%; text-align: left; border: 0; border-radius: 7px;
            background: transparent; padding: 9px 10px; cursor: pointer;
            font-family: inherit; color: #222;
        }
        .role-option:hover { background: #f6f5ff; }
        .role-option.is-active { background: #efedff; }
        .role-option.is-disabled { opacity: .45; cursor: not-allowed; }
        .role-option.is-disabled:hover { background: transparent; }
        .role-option__title { font-size: 13px; font-weight: 600; }
        .role-option__desc { font-size: 11px; color: #777; line-height: 1.4; }
        .role-btn--locked { background: #eef0f2; color: #666; border-color: #d8dade; cursor: default; }
        .role-btn--locked:hover { background: #eef0f2; }
        .role-menu__hint {
            font-size: 11px; color: #8a6d00; line-height: 1.45;
            background: #fff8e1; border: 1px solid #ffe082; border-radius: 7px;
            padding: 8px 10px; margin: 2px 2px 6px;
        }
        .session-card__role {
            display: inline-block; margin-left: 8px; padding: 1px 7px;
            border-radius: 8px; font-size: 10px; font-weight: 600;
            background: #f0efff; color: #4b43a8; vertical-align: middle;
        }
        /* 标题栏：标题过长时单行省略，不与右侧角色/菜单按钮互挤。
           模型精炼后标题本就很短，这里是 CSS 层的最后一道兜底。 */
        #chatTitle {
            flex: 1; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="wechat-header">
            <h1 class="wechat-title" id="chatTitle">AI 对话</h1>
            <!-- 模型角色选择器：默认闲聊，用户显式选定后才加载对应提示词/背景知识 -->
            <div class="role-picker">
                <button class="role-btn" id="roleBtn" type="button">💬 闲聊 ▾</button>
                <div class="role-menu" id="roleMenu"></div>
            </div>
            <button class="toolbar-btn" id="menuBtn" title="会话操作">⋮</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="status">
                <span>💬</span>
                <span>正在准备对话…</span>
            </div>
            <div id="notReady" style="display: none;">
                尚未配置 LLM。请回到<a href="./index.html">功能助手</a>执行 /llm 配置后再来对话。
            </div>
        </div>

        <!-- PDF 处理模式：默认端侧抽文字；要看版式/扫描件时选「送模型原文」 -->
        <div class="attach-mode" id="attachMode">
            <label for="pdfMode">PDF 读取方式</label>
            <select id="pdfMode">
                <option value="text">端侧抽文字（默认，适用于有文字层的 PDF）</option>
                <option value="native">送模型原文（扫描件 / 需要看版式，端点需支持原生 PDF）</option>
            </select>
        </div>
        <div id="attachPreview"></div>

        <div class="input-container">
            <!-- 选附件是纯本地行为，不依赖 LLM 配置；故意不带 disabled。
                 否则没配 /llm 时点它毫无反应，用户不知道是没配置还是按钮坏了。 -->
            <button class="toolbar-btn attach-btn" id="attachBtn" title="附加 PDF / 图片" type="button">📎</button>
            <input type="file" id="attachInput" accept="application/pdf,image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple hidden>
            <textarea class="input-textarea" id="userInput" placeholder="继续对话…" rows="1" disabled></textarea>
            <button class="toolbar-btn send-btn" id="sendBtn" title="发送" disabled>➤</button>
        </div>

        <!-- 右上角菜单：会话四项 + 插件管理 + 技能管理 -->
        <div class="command-menu" id="commandMenu">
            <div class="command-item" id="miNew">
                <div class="command-icon">➕</div>
                <div class="command-title">新建会话</div>
            </div>
            <div class="command-item" id="miHistory">
                <div class="command-icon">📋</div>
                <div class="command-title">历史会话</div>
            </div>
            <div class="command-item" id="miExport">
                <div class="command-icon">📤</div>
