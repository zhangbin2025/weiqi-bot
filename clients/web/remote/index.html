<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no, viewport-fit=cover">
  <title>远程隧道 - 围棋智能助手</title>
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="../shared/assets/css/ui.css">
  <style>
    /* assistant 风标题栏 */
    .wechat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }
    .wechat-title {
      font-size: 18px;
      font-weight: 600;
      color: white;
    }
    .header-menu-btn {
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      color: white;
      user-select: none;
    }

    /* 内容区 */
    .remote-content {
      flex: 1;
      padding: 0 12px 24px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    /* 区块卡片 */
    .remote-section {
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .section-title {
      background: #f8f9fa;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title .count-badge {
      margin-left: auto;
      font-size: 12px;
      color: #999;
      font-weight: 400;
    }

    /* 状态卡片 */
    .status-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #999;
      flex-shrink: 0;
      transition: background 0.3s;
      box-shadow: 0 0 6px rgba(0,0,0,0.15);
    }
    .status-dot.connected {
      animation: pulse-green 2s ease-in-out infinite;
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 6px rgba(102,187,106,0.4); }
      50% { box-shadow: 0 0 12px rgba(102,187,106,0.8); }
    }
    .status-info {
      flex: 1;
      min-width: 0;
    }
    .status-label {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .status-detail {
      font-size: 12px;
      color: #999;
      margin-top: 3px;
    }

    /* 滚动列表 */
    .scroll-list {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .log-list {
      max-height: 320px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px 4px;
    }

    /* 列表项 */
    .list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 0.5px solid #f0f0f0;
    }
    .list-item:last-child { border-bottom: none; }
    .item-icon { font-size: 14px; flex-shrink: 0; }
    .item-main {
      font-size: 13px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      color: #999;
      margin-left: auto;
      white-space: nowrap;
    }

    /* 日志条目 */
    .log-entry {
      padding: 6px 10px;
      margin: 2px 8px;
      border-radius: 4px;
      background: #f9f9f9;
      border-left: 3px solid #ddd;
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .log-time { color: #999; flex-shrink: 0; font-size: 10px; }
    .log-msg { flex: 1; word-break: break-all; }

    /* 空提示 */
    .empty-hint {
      padding: 24px;
      text-align: center;
      color: #ccc;
      font-size: 13px;
    }

    /* 扩展菜单 */
    .command-menu {
      position: fixed;
      top: calc(50px + env(safe-area-inset-top));
      right: 12px;
      width: 180px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: none;
      z-index: 1000;
      overflow: hidden;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .command-item {
      padding: 12px 16px;
      border-bottom: 0.5px solid #E8E8E8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .command-item:hover, .command-item:active { background: #F7F7F7; }
    .command-item:last-child { border-bottom: none; }
    .command-icon { font-size: 20px; }
    .command-title { font-size: 16px; color: #000; }
    .command-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      z-index: 999;
    }

    /* 小屏幕优化 */
    @media (max-width: 360px) {
      .wechat-title { font-size: 16px; }
      .item-meta { font-size: 10px; }
    }
  </style>

  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#667eea">
</head>
<body>
  <div class="glass-container">
    <div class="wechat-header">
      <span class="wechat-title">🔗 远程隧道</span>
      <div class="header-menu-btn" onclick="toggleCommandMenu()">☰</div>
    </div>
    <div class="remote-content">
      <div id="page-root"></div>
    </div>
  </div>

  <script src="../shared/error-catch.js"></script>
  <script type="module" src="./index.ts"></script>
  <script src="../shared/status-bar.js"></script>
</body>
</html>
