<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>远程隧道 - 围棋智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #5a3d7a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            color: #333;
        }

        .page-container {
            background: white;
            width: 100%;
            max-width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (min-width: 600px) {
            body { padding: 16px; align-items: center; }
            .page-container {
                max-width: 520px;
                height: calc(100vh - 32px);
                max-height: 800px;
                border-radius: 16px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                overflow: hidden;
                padding-bottom: 0;
            }
        }

        .wechat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: calc(2px + env(safe-area-inset-top)) 16px 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
        }
        @media (min-width: 600px) {
            .wechat-header {
                padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
                border-radius: 16px 16px 0 0;
            }
        }
        .wechat-title { font-size: 18px; font-weight: 600; color: white; }
        .header-menu-btn { font-size: 22px; cursor: pointer; padding: 4px 8px; color: white; user-select: none; }

        /* 标签栏 */
        .tab-bar {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .tab-item {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 13px;
            color: #999;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            user-select: none;
        }
        .tab-item.active {
            color: #667eea;
            font-weight: 600;
        }
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #667eea;
            border-radius: 1px;
        }
        .tab-badge {
            display: inline-block;
            font-size: 10px;
            background: #e0e0e0;
            color: #666;
            border-radius: 8px;
            padding: 0 5px;
            margin-left: 3px;
            min-width: 16px;
            line-height: 14px;
        }
        .tab-item.active .tab-badge {
            background: #667eea;
            color: white;
        }

        /* 内容区 - 无自身滚动条，靠子页面滚动 */
        .remote-content {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }
        #page-root { height: 100%; }
        .tab-panel {
            display: none;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab-panel.active { display: flex; flex-direction: column; }

        /* 状态卡片 */
        .status-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #999; flex-shrink: 0; transition: background 0.3s;
            box-shadow: 0 0 6px rgba(0,0,0,0.15);
        }
        .status-dot.connected { animation: pulse-green 2s ease-in-out infinite; }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 6px rgba(102,187,106,0.4); }
            50% { box-shadow: 0 0 12px rgba(102,187,106,0.8); }
        }
        .status-info { flex: 1; min-width: 0; }
        .status-label { font-size: 19px; font-weight: 600; color: #333; }
        .status-detail { font-size: 14px; color: #999; margin-top: 4px; }

        /* 列表 */
        .list-item {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 18px; border-bottom: 0.5px solid #f0f0f0;
        }
        .list-item:last-child { border-bottom: none; }
        .item-icon { font-size: 18px; flex-shrink: 0; }
        .item-main {
            font-size: 15px; color: #333; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-meta {
            font-size: 13px; color: #888; margin-left: auto; white-space: nowrap;
        }

        /* 日志 */
        .log-entry {
            padding: 10px 16px; margin: 4px 8px;
            border-radius: 8px; background: #f9f9f9;
            border-left: 3px solid #ddd;
        }
        .log-entry-header {
            display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
        }
        .log-level {
            font-size: 11px; font-weight: 600; padding: 1px 6px;
            border-radius: 4px; text-transform: uppercase;
        }
        .log-level.info { background: #e3f2fd; color: #1976d2; }
        .log-level.warn { background: #fff3e0; color: #f57c00; }
        .log-level.error { background: #ffebee; color: #d32f2f; }
        .log-time { color: #aaa; font-size: 12px; }
        .log-msg { word-break: break-word; font-size: 14px; line-height: 1.6; color: #333; }

        .empty-hint { padding: 40px 20px; text-align: center; color: #bbb; font-size: 15px; }

        /* 扩展菜单 */
        .command-menu {
            position: absolute; top: calc(46px + env(safe-area-inset-top));
            right: 10px; width: 180px; background: #fff;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none; z-index: 1000; overflow: hidden;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .command-item {
            padding: 12px 16px; border-bottom: 0.5px solid #E8E8E8;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: background 0.15s;
        }
        .command-item:hover, .command-item:active { background: #F7F7F7; }
        .command-item:last-child { border-bottom: none; }
        .command-icon { font-size: 20px; }
        .command-title { font-size: 16px; color: #000; }
        .command-menu-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.3); display: none; z-index: 999;
        }

        @media (max-width: 360px) {
            .wechat-title { font-size: 17px; }
            .tab-item { font-size: 13px; }
            .item-meta { font-size: 12px; }
        }
    </style>

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
<script>
    // Fallback: 防止 JS 加载前点击报错
    window.toggleCommandMenu = window.toggleCommandMenu || function(){};
    window.switchTab = window.switchTab || function(){};
    window.showConfigDialog = window.showConfigDialog || function(){};
    window.manualRefresh = window.manualRefresh || function(){};
  </script>
</head>
<body>
    <div class="page-container">
        <div class="wechat-header">
            <span class="wechat-title">🔗 远程隧道</span>
            <div class="header-menu-btn" onclick="toggleCommandMenu()">☰</div>
        </div>
        <div class="tab-bar">
            <div class="tab-item active" data-tab="status" onclick="switchTab('status')">状态</div>
            <div class="tab-item" data-tab="clients" onclick="switchTab('clients')">接入 <span class="tab-badge" id="badgeClients">0</span></div>
            <div class="tab-item" data-tab="rpc" onclick="switchTab('rpc')">RPC <span class="tab-badge" id="badgeRpc">0</span></div>
            <div class="tab-item" data-tab="logs" onclick="switchTab('logs')">日志 <span class="tab-badge" id="badgeLogs">0</span></div>
        </div>
        <div class="remote-content">
            <div id="page-root"></div>
        </div>
        <div class="command-menu" id="commandMenu">
            <div class="command-item" onclick="showConfigDialog()">
                <div class="command-icon">🔧</div>
                <div class="command-title">配置</div>
            </div>
            <div class="command-item" onclick="manualRefresh()">
                <div class="command-icon">🔄</div>
                <div class="command-title">刷新</div>
            </div>
        </div>
        <div class="command-menu-overlay" id="commandMenuOverlay" onclick="toggleCommandMenu()"></div>
    </div>

    <script src="../shared/error-catch.js"></script>
    <script type="module" src="./index.ts"></script>
    <script src="../shared/status-bar.js"></script>
</body>
</html>
