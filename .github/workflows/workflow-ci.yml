name: Workflow runtime CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout weiqi-bot
        uses: actions/checkout@v4
        with:
          path: weiqi-bot
      - name: Checkout local worker dependency
        uses: actions/checkout@v4
        with:
          repository: zhangbin2025/weiqi-worker
          path: weiqi-worker
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: weiqi-bot/package-lock.json
      - name: Install dependencies
        working-directory: weiqi-bot
        run: npm ci
      - name: Type check
        working-directory: weiqi-bot
        run: npm run typecheck
      - name: Verify Workflow and sandbox lifecycle
        working-directory: weiqi-bot
        run: npx vitest run infrastructure/plugin-vm/__tests__/QuickJsRuntime.test.ts application/skill/__tests__/WorkflowRunner.test.ts
